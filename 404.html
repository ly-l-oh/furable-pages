<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>furable.404</title>
    <style>
        body {
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          min-height: 100vh;
          margin: 0;
          background: #f0f6ff;
          color: #2c3e50;
        }
      
        h1, h2, h3 {
          text-align: center;
          margin: 10px 0;
        }
      
        h1[name="n"] {
          position: fixed;
          top: 16px;
          left: 20px;
          margin: 0;
          font-size: 25px;
          text-align: left;
          color: #3a7bd5;
        }
      
        a {
          display: block;
          width: fit-content;
          padding: 14px 40px;
          background: rgba(58, 123, 213, 0.75);
          color: #ffffff;
          text-decoration: none;
          border-radius: 50px;
          font-size: 16px;
          font-weight: bold;
          box-shadow: 0 6px 15px rgba(58, 123, 213, 0.5), inset 0 2px 4px rgba(255, 255, 255, 0.3), inset 0 -2px 4px rgba(0, 0, 0, 0.15);
          transition: all 0.2s ease;
          margin: 10px auto;
        }
      
        a:hover {
          background: rgba(58, 123, 213, 0.9);
          box-shadow: 0 6px 20px rgba(58, 123, 213, 0.65), inset 0 2px 4px rgba(255, 255, 255, 0.4), inset 0 -2px 4px rgba(0, 0, 0, 0.15);
        }
      
        a:active {
          background: rgba(58, 123, 213, 0.95);
          box-shadow: 0 2px 5px rgba(58, 123, 213, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.2), 0 0 20px rgba(58, 123, 213, 0.6);
          transform: translateY(3px);
        }
    </style>
</head>
<body>
    <h1 name="n">furable</h1>
    <h1>404 Not Found</h1>
    <h2>页面找不到或不存在</h2>
    <h2>您可以检查URL是否正确，或<a href="/index.html">回到主页</a></h2>
</body>
</html>
